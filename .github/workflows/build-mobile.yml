name: Build Mobile (Android / iOS)

# 移动端产物：
#   - Android：3 个设备形态 flavor（phone/tablet/automotive）× 2 种 buildType
#     （debug 可侧载 / release 正式）共 6 个 APK
#   - iOS：未签名 ipa（不上架 App Store，用户自签 / AltStore 安装）
#     iOS 默认关闭，需要在仓库 Settings → Variables 里设置 ENABLE_IOS=true 才执行。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    name: android-apk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        # ubuntu-22.04 runner 预装 Android SDK，ANDROID_SDK_ROOT 已就绪；
        # 不再使用 android-actions/setup-android（该 action 在本仓库会失败）。
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT" | head -10 || true

      - name: Normalize lockfile to public npm registry
        working-directory: app
        run: |
          node -e "const f='package-lock.json',fs=require('fs');let s=fs.readFileSync(f,'utf8');s=s.replace(/https:\/\/registry\.npmmirror\.com\//g,'https://registry.npmjs.org/');fs.writeFileSync(f,s);"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web bundle for mobile (vite)
        working-directory: app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          set +e
          npx vite build --config vite.mobile.config.ts > /tmp/vite.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # 把最后 20 行以 ::error:: 注解输出，便于在 run 页面直接看到原因
            tail -20 /tmp/vite.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $code
          fi
          tail -5 /tmp/vite.log

      - name: Copy sql-wasm
        working-directory: app
        run: node scripts/copy-wasm.mjs

      - name: Normalize mobile entry html
        working-directory: app
        run: node scripts/rename-mobile-html.mjs

      - name: Capacitor sync
        working-directory: app
        run: npx cap sync android

      - name: Assert web assets integrity after sync
        # v2.3.2 事故：本地 cap sync 曾在删除旧 assets 后中断，APK 缺 index.html
        # 导致真机「网页无法打开」。CI 上同样加断言，缺文件直接失败。
        working-directory: app
        run: |
          test -f android/app/src/main/assets/public/index.html || { echo "::error::missing assets/public/index.html (cap sync incomplete)"; exit 1; }
          test -f android/app/src/main/assets/capacitor.config.json || { echo "::error::missing assets/capacitor.config.json"; exit 1; }
          test -f android/app/src/main/assets/public/cordova.js || { echo "::error::missing cordova.js"; exit 1; }
          ls android/app/src/main/assets/public/assets/sql-wasm.wasm >/dev/null || { echo "::error::missing sql-wasm.wasm"; exit 1; }
          # 产物对账：APK 内 js/css/wasm 数量必须等于 dist/mobile 产物数量
          DIST_N=$(ls dist/mobile/assets/*.js dist/mobile/assets/*.css dist/mobile/assets/*.wasm 2>/dev/null | wc -l)
          echo "dist/mobile assets: $DIST_N"
          grep -q "index.mobile" android/app/src/main/assets/public/index.html && echo "index.html references ok"

      - name: Gradle assemble (all flavors & build types)
        working-directory: app/android
        run: |
          chmod +x gradlew
          set +e
          # gradle.properties 里为本地开发写死了 Windows JDK 路径（org.gradle.java.home），
          # runner 上不存在，用命令行参数覆盖成 runner 的 JAVA_HOME。
          # assemble 构建全部 3 flavor（phone/tablet/automotive）的 debug + release
          ./gradlew assemble --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" > /tmp/gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -45 /tmp/gradle.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $code
          fi
          tail -5 /tmp/gradle.log

      - name: Assert all APKs contain entry page
        working-directory: app/android
        run: |
          FLAVORS="phone tablet automotive"
          BUILD_TYPES="debug release"
          for flavor in $FLAVORS; do
            for bt in $BUILD_TYPES; do
              apk="app/build/outputs/apk/${flavor}/${bt}/app-${flavor}-${bt}.apk"
              if [ -f "$apk" ]; then
                unzip -l "$apk" | grep -q "assets/public/index.html" || { echo "::error::$apk missing assets/public/index.html"; exit 1; }
                echo "OK: $apk"
              else
                echo "warn: $apk not found (may be skipped by buildType filter)"
              fi
            done
          done

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: starwish-android-apk
          path: |
            app/android/app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios-unsigned-ipa
    # 首次运行会用 `cap add ios` 生成 ios/ 工程；后续建议把 ios/ 提交进仓库以保证可复现。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web bundle for mobile
        working-directory: app
        run: npm run build:mobile

      - name: Add iOS platform (first run only)
        working-directory: app
        run: |
          npm i @capacitor/ios@^6.2.2
          npx cap add ios || true
          npx cap sync ios

      - name: Xcode archive (unsigned)
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned ipa
        working-directory: app/ios/App
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry StarWish-unsigned.ipa Payload

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: starwish-ios-ipa
          path: app/ios/App/StarWish-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
