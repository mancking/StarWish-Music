name: Release

# tag 推送（v*）时：等待 build-desktop / build-mobile 两条工作流完成，
# 归集五端产物 + 本地补建 Windows 包，创建 GitHub Release 并附发布说明。
# 说明文档：docs/StarWish-Music-v2.3.1-发布说明.md（body 取 docs 里最新版发布说明）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  win:
    name: windows-portable-zip
    runs-on: windows-2022
    env:
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Normalize lockfile to public npm registry
        working-directory: app
        run: |
          node -e "const f='package-lock.json',fs=require('fs');let s=fs.readFileSync(f,'utf8');s=s.replace(/https:\/\/registry\.npmmirror\.com\//g,'https://registry.npmjs.org/');fs.writeFileSync(f,s);console.log('lockfile registry rewritten');"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer + electron main
        working-directory: app
        run: npm run build

      - name: Assert renderer entry integrity
        working-directory: app
        run: |
          test -f dist/renderer/index.html || { echo "::error::missing dist/renderer/index.html"; exit 1; }
          echo "renderer entry ok"

      - name: Package portable + zip
        working-directory: app
        run: npx electron-builder --win portable zip --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starwish-windows-x64
          path: |
            app/dist/release/*.exe
            app/dist/release/*.zip
          if-no-files-found: error
          retention-days: 14

  collect:
    name: create-github-release
    needs: [win]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Wait for build-desktop & build-mobile runs on the same tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          wait_for() {
            local wf="$1"
            for i in $(seq 1 60); do
              status=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?head_sha=$SHA" \
                --jq '.workflow_runs[0] | (.status // "missing") + ":" + (.conclusion // "")' || echo "api-error:")
              echo "$wf -> $status"
              case "$status" in
                completed:success) return 0 ;;
                completed:*) echo "$wf did not succeed ($status)"; return 1 ;;
              esac
              sleep 60
            done
            echo "timeout waiting $wf"; return 1
          }
          # iOS 默认关闭（仓库 Variables 里 ENABLE_IOS=true 才跑），缺失不视为失败
          wait_for "build-desktop.yml" || exit 1
          wait_for "build-mobile.yml" || echo "warn: build-mobile missing/failed (iOS disabled?)"

      - name: Download all artifacts of this tag's runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/assets
          SHA="${{ github.sha }}"
          for wf in build-desktop.yml build-mobile.yml; do
            run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?head_sha=$SHA" --jq '.workflow_runs[0].id' || true)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              echo "downloading artifacts of $wf run $run_id"
              gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
                --paginate --jq '.artifacts[] | .id' | while read -r aid; do
                name=$(gh api "repos/${{ github.repository }}/actions/artifacts/$aid" --jq '.name')
                gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > "/tmp/$name.zip"
                unzip -o -j "/tmp/$name.zip" -d "dist/assets/$name" >/dev/null
              done
            fi
          done
          # 本工作流自己的 Windows 产物
          ls -la dist/assets || true

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: starwish-windows-x64
          path: dist/assets/starwish-windows-x64

      - name: Flatten assets
        run: |
          mkdir -p dist/final
          find dist/assets -type f | while read -r f; do cp "$f" dist/final/; done
          # 资产名一律 ASCII + 带版本号：中文名在跨 runner 的 zip/unzip 之间会被
          # 解成乱码（历史上出现过 "-2.3.4-.exe"），且 GitHub 资产 URL 也拒绝中文。
          VER="${GITHUB_REF_NAME#v}"
          cd dist/final
          [ -f app-debug.apk ] && mv app-debug.apk "StarWish-${VER}-android-debug.apk"
          [ -f app-release.apk ] && mv app-release.apk "StarWish-${VER}-android.apk"
          [ -f StarWish-unsigned.ipa ] && mv StarWish-unsigned.ipa "StarWish-${VER}-ios-unsigned.ipa"
          cd -
          ls -la dist/final

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(ls docs/StarWish-Music-v*-发布说明.md 2>/dev/null | sort | tail -1)
          # Release 已存在时 gh release create 会失败，回退分支不仅要上传资产，
          # 还要 gh release edit 把标题与说明刷新（否则说明永远是首次发布的旧版）。
          if gh release create "$TAG" dist/final/* \
              --title "星河音乐 ${TAG}" \
              --notes-file "$NOTES" \
              --latest; then
            echo "release created"
          else
            echo "release exists -> upload + refresh notes"
            gh release upload "$TAG" dist/final/* --clobber
            gh release edit "$TAG" --title "星河音乐 ${TAG}" --notes-file "$NOTES" --latest
          fi
