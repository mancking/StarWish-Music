name: Build Desktop (Linux / macOS)

# Linux 与 macOS 安装包无法在 Windows 开发机上构建，故由本工作流产出。
# 只产出 artifact，不创建 Release（Release 另行处理）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            artifact: starwish-linux-x64
            build: npx electron-builder --linux AppImage deb --x64 --publish never
            glob: |
              app/dist/release/*.AppImage
              app/dist/release/*.deb
          - name: mac-x64
            os: macos-13
            artifact: starwish-macos-x64
            build: npx electron-builder --mac zip --x64 --publish never
            glob: |
              app/dist/release/*.zip
          - name: mac-arm64
            os: macos-14
            artifact: starwish-macos-arm64
            build: npx electron-builder --mac zip --arm64 --publish never
            glob: |
              app/dist/release/*.zip
    env:
      # 仓库没有 Apple 开发者证书：强制未签名（app-builder-lib/out/util/flags.js 读此变量）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      APPLE_ID: ''
      APPLE_APP_SPECIFIC_PASSWORD: ''
      APPLE_TEAM_ID: ''
      # lockfile 指向 npmmirror；无 token 时不要直接失败
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Normalize lockfile to public npm registry
        # lockfile 里 542 处 tarball 全部指向 registry.npmmirror.com；若该镜像当日
        # 不健康，macOS runner 首轮就装不上依赖。不新增依赖，只改写主机名，
        # 改写后仍是合法 JSON 与 lockfileVersion 3，npm ci 正常接受。
        working-directory: app
        run: |
          node -e "const f='package-lock.json',fs=require('fs');let s=fs.readFileSync(f,'utf8');s=s.replace(/https:\/\/registry\.npmmirror\.com\//g,'https://registry.npmjs.org/');fs.writeFileSync(f,s);console.log('lockfile registry rewritten');"

      - name: Check lockfile platform coverage
        # 已核实 lockfile 含各平台 optional 依赖；此处仅在将来 lockfile 被
        # Windows-only 重新生成时提前暴露问题（缺依赖会在打包阶段报难懂的错）。
        working-directory: app
        run: |
          node -e "const c=require('fs').readFileSync('package-lock.json','utf8');const need=['@esbuild/linux-x64','@esbuild/darwin-x64','@esbuild/darwin-arm64'];const miss=need.filter(p=>!c.includes('node_modules/'+p));console.log('missing platform optional deps:',miss.join(', ')||'none');if(miss.length)process.exit(1);"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer + electron main
        working-directory: app
        run: npm run build

      - name: Package
        working-directory: app
        run: ${{ matrix.build }}

      - name: List release output
        if: always()
        working-directory: app
        run: ls -la dist/release || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

# 核实结论（读 app/node_modules 内已装的 electron-builder 24.13.3 源码得到，
# 非推测）：本工作流在 app/package.json 完全不改的前提下即可构建 linux/mac：
#   - 目标：out/builder.js normalizeOptions() 只在 CLI 传了对应平台标志时写入
#     options.targets（本例只写 LINUX 或 MAC），build.win.target 不会被牵连，
#     也不会误触发 MAC-only 保护（packager.js:346 只在 Windows 主机上抛错）。
#   - 架构：--x64 / --arm64 即 commonArch() 的 arch 来源（builder.js:23-38），
#     不需要在 build.mac.target 里重复声明 arch。
#   - 图标：build/{win,linux,mac}.icon 均未设 → 回落 buildResources(=resources)
#     的约定文件名；resources/icon.png 是 1280x1280，mac 会转 .icns、linux 转
#     多尺寸 png，满足 ≥512x512 要求，不会因缺图标失败。
#   - 签名：CSC_IDENTITY_AUTO_DISCOVERY=false（util/flags.js:14）→ 跳过钥匙串查找。
#   - artifactName：platformPackager.js:456 的优先级是「target 级 → 平台级 →
#     顶层 config.artifactName」，顶层只有 directories/asar/files，故 mac/linux
#     用 electron-builder 默认名（linux 即 星河音乐-2.0.0-x86_64.AppImage，
#     正是期望的样式）。build.win.artifactName 属平台级，不会外溢到 mac。
#
# 因此下列改动不是「必须」，只是可选的可读性/可控性提升：
#
# 1) 想在 package.json 里把目标与图标显式钉住（这样 CLI 可以只写
#    `npx electron-builder --linux --x64`、`--mac --x64`），在 "win" 段旁加：
#    "linux": {
#      "target": [
#        { "target": "AppImage", "arch": ["x64"] },
#        { "target": "deb", "arch": ["x64"] }
#      ],
#      "icon": "resources/icon.png",
#      "category": "AudioVideo",
#      "artifactName": "星河音乐-${version}-${arch}.${ext}"
#    },
#    "mac": {
#      "target": [{ "target": "zip", "arch": ["x64", "arm64"] }],
#      "icon": "resources/icon.png",
#      "category": "public.app-category.music",
#      "identity": null,
#      "artifactName": "StarWish-${version}-${arch}.${ext}"
#    }
#    末行 mac.artifactName 是纯 ASCII：不加的话 mac zip 默认名为
#    「星河音乐-2.0.0-x64.zip」，中文名在 artifact 上传/下载链路上有编码风险。
#
# 2) app/package-lock.json 无需改动（lockfileVersion 3，已含
#    @esbuild/{linux-x64,darwin-x64,darwin-arm64}、@rollup/rollup-{linux-x64-gnu,
#    darwin-arm64} 等各平台 optional 依赖）。
